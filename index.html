<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorfly Studio | Generador de Paletas</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" aria-label="Panel de control y configuración">
            <header class="sidebar-header">
                <h1>Colorfly Studio</h1>
                <p>Generador interactivo de paletas de colores</p>
            </header>

            <div class="sidebar-controls">
                <fieldset style="border: none; padding: 0; margin: 0;">
                    <legend class="sr-only" style="display: none;">Configuración de la paleta</legend>
                    
                    <div class="control-group">
                        <label for="palette-size">Tamaño de paleta:</label>
                        <select id="palette-size" aria-label="Seleccionar tamaño de la paleta">
                            <option value="6">6 colores</option>
                            <option value="8" selected>8 colores</option>
                            <option value="9">9 colores</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label for="color-format">Formato:</label>
                        <select id="color-format" aria-label="Seleccionar formato de color">
                            <option value="hex" selected>HEX</option>
                            <option value="hsl">HSL</option>
                        </select>
                    </div>

                    <button id="generate-btn" class="btn-primary">Generar paleta</button>
                    <button id="save-palette-btn" class="btn-secondary" style="margin-top: 10px; width: 100%;">Guardar paleta actual</button>
                </fieldset>
            </div>

            <div class="saved-palettes-section">
                <h3>Paletas Guardadas</h3>
                <div id="saved-palettes-container" class="saved-palettes-container">
                    </div>
            </div>
        </aside>

        <main class="main-content" aria-label="Área de visualización de paleta">
            <section id="palette-backdrop" class="palette-backdrop">
                <div id="palette-container" class="palette-grid">
                </div>
            </section>
        </main>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite">¡Código copiado al portapapeles!</div>

    <script src="js/script.js"></script>
</body>
</html>
